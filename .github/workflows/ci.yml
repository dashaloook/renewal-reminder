# Checks that run on every push and pull request. `main` only accepts changes that pass them.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  web:
    name: Web app syntax (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: for f in *.js; do node --check "$f" || exit 1; done
      - run: python3 -c "import json; [json.load(open(f)) for f in ('vercel.json', 'manifest.webmanifest')]"

  rules:
    name: Database rules (Firebase emulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm test

  browser:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r tests/e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/e2e -v
      - name: Screenshots and traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
